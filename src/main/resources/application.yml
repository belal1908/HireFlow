spring:
  application:
    name: hireflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hireflow}
    username: ${DB_USERNAME:hireflow}
    password: ${DB_PASSWORD:hireflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_FILE_SIZE:5MB}
      max-request-size: ${RESUME_MAX_FILE_SIZE:5MB}

server:
  port: ${SERVER_PORT:8080}

hireflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  resume:
    # Outside src/, gitignored - see README "Résumé storage". Relative paths resolve against the
    # process working directory (the project root for both `mvn spring-boot:run` and `mvn test`,
    # /app inside the Docker image - see docker-compose.yml's backend volume mount).
    storage-dir: ${RESUME_STORAGE_DIR:./data/resumes}
    max-size-bytes: ${RESUME_MAX_SIZE_BYTES:5242880} # 5MB, mirrors spring.servlet.multipart above
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
  email-verification:
    # Longer-lived than the password-reset token (30 min) - verification links conventionally
    # stay valid much longer, since there's no urgency comparable to "someone may be resetting
    # your password right now".
    token-ttl-hours: ${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}
  admin-bootstrap:
    # Opt-in: only creates the first ADMIN account if both are set AND no ADMIN exists yet.
    # See AdminBootstrapRunner / README "Admin user management" for the bootstrap problem this solves.
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

logging:
  level:
    com.hireflow: INFO
  pattern:
    # %X{requestId} pulls the per-request correlation ID that RequestIdFilter puts in the MDC -
    # "no-request-id" only shows up for log lines emitted outside an HTTP request (e.g. startup).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"
