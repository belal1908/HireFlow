<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Log in</h1>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput id="email" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <mat-error>Enter a valid email address.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <mat-error>Password is required.</mat-error>
      }
    </mat-form-field>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>

    <p class="switch-link">No account? <a routerLink="/register">Register</a></p>
  </form>
</div>
