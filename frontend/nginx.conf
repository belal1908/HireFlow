# Minimal static-file + SPA-fallback config for the Angular production build.
# No API proxying here: the browser calls the backend directly at environment.ts's apiUrl
# (http://localhost:8080), not through this nginx instance — see the Dockerfile comment.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
