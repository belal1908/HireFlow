name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend (full 262-test suite, incl. Testcontainers)
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests (headless Chrome)
        working-directory: frontend
        # karma.conf.js already defines/defaults to the ChromeHeadlessNoSandbox launcher (added
        # for this project's local sandboxed dev environment); ubuntu-latest ships Chrome
        # preinstalled but karma.conf.js's own CHROME_BIN fallback is a macOS-only path, so it
        # must be pointed at whatever Chrome binary actually exists on the runner.
        run: |
          export CHROME_BIN=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)
          npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Production build
        working-directory: frontend
        run: npx ng build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ubuntu-latest ships Docker + the Compose v2 plugin natively - no Colima-style
      # DOCKER_HOST/Ryuk workarounds needed here (those are this project's local-machine-only
      # quirk, documented in the README).
      - name: Bring up the full stack (Postgres + backend + frontend)
        run: docker compose --profile full up -d --build

      - name: Wait for backend and frontend to respond
        run: |
          timeout 120 bash -c 'until curl -s -o /dev/null http://localhost:8080/api/postings; do sleep 2; done'
          timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:4200; do sleep 2; done'

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose --profile full down -v
